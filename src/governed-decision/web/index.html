<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UseSteady — Governed Decisions</title>
    <style>
      :root {
        --bg: #0b0e14;
        --panel: #121722;
        --panel-2: #0f141d;
        --line: #1e2735;
        --text: #e6edf6;
        --muted: #8b97a8;
        --cyan: #36c5d0;
        --green: #36d399;
        --blue: #5b9dff;
        --gray: #5b6675;
        --amber: #e0a93b;
        --red: #e06b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 20px 28px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #101622, #0b0e14);
      }
      header h1 { margin: 0; font-size: 18px; letter-spacing: 0.2px; }
      header p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
      .wrap { display: grid; grid-template-columns: 360px 1fr; gap: 0; min-height: calc(100vh - 78px); }
      .left { border-right: 1px solid var(--line); padding: 18px; overflow-y: auto; }
      .right { padding: 22px 28px; overflow-y: auto; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; }
      textarea, input {
        width: 100%; background: var(--panel-2); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit;
      }
      textarea { resize: vertical; min-height: 64px; }
      .field { margin-bottom: 10px; }
      button {
        font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
        background: var(--panel); color: var(--text); padding: 9px 14px;
      }
      button.primary { background: linear-gradient(180deg, #2aa6b1, #1f8590); border-color: #1f8590; color: #02161a; font-weight: 600; }
      button.approve { border-color: #1f6f50; color: var(--green); }
      button.reject { border-color: #6f2b2b; color: var(--red); }
      button:disabled { opacity: 0.5; cursor: default; }
      .thread {
        border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px;
        cursor: pointer; background: var(--panel-2); transition: border-color .12s;
      }
      .thread:hover { border-color: var(--cyan); }
      .thread.active { border-color: var(--cyan); background: #10202a; }
      .thread .goal { font-size: 13px; }
      .thread .meta { color: var(--muted); font-size: 11px; margin-top: 5px; display: flex; gap: 8px; align-items: center; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 600; letter-spacing: .3px; border: 1px solid; }
      .b-pending { color: var(--amber); border-color: #5a4717; background: #20190a; }
      .b-approved { color: var(--green); border-color: #1f6f50; background: #0c1f17; }
      .b-rejected { color: var(--red); border-color: #6f2b2b; background: #200d0d; }
      .b-connected { color: var(--green); border-color: #1f6f50; background: #0c1f17; }
      .b-derived { color: var(--blue); border-color: #2a4f86; background: #0c1626; }
      .b-unavailable { color: var(--gray); border-color: #303a49; background: #10151d; }
      .section { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 9px; background: var(--panel-2); }
      .section .head { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; }
      .section .stage { font-weight: 600; text-transform: capitalize; }
      .section .body { color: var(--muted); font-size: 12.5px; white-space: pre-wrap; }
      .epi { display: grid; grid-template-columns: 110px 190px 1fr; gap: 8px; align-items: start; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
      .epi:first-child { border-top: none; }
      .epi .kind { font-weight: 600; text-transform: capitalize; }
      .epi .stmt { color: var(--muted); }
      .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; background: var(--panel); }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .muted { color: var(--muted); }
      .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; color: var(--muted); }
      .empty { color: var(--muted); padding: 30px 6px; text-align: center; }
      .note { color: var(--muted); font-size: 11.5px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
      .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 360px; }
      .toast.err { border-color: #6f2b2b; color: var(--red); }
    </style>
  </head>
  <body>
    <header>
      <h1>UseSteady — Governed Decisions</h1>
      <p>Models propose. Humans ratify. The core certifies. Reality has the final veto. This Portal only projects runtime truth — the single write is your ratifying decision.</p>
    </header>

    <div class="wrap">
      <div class="left">
        <h2>Propose a decision</h2>
        <div class="field"><textarea id="goal" placeholder="What should happen? e.g. create a folder called utils"></textarea></div>
        <div class="field"><input id="constraints" placeholder="Constraints (optional, comma-separated)" /></div>
        <div class="row"><button class="primary" id="propose">Propose (create draft)</button></div>

        <h2 style="margin-top:22px">Decisions</h2>
        <div id="threads"><div class="empty">Loading…</div></div>
      </div>

      <div class="right">
        <div id="detail"><div class="empty">Select a decision to inspect its governed record.</div></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let activeRecordId = null;

      function toast(msg, isErr) {
        const t = document.createElement("div");
        t.className = "toast" + (isErr ? " err" : "");
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3200);
      }

      async function api(method, path, body) {
        const res = await fetch("/api/governed" + path, {
          method,
          headers: body ? { "Content-Type": "application/json" } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        const json = await res.json().catch(() => ({}));
        return { status: res.status, json };
      }

      function decisionBadge(d) {
        if (d === "approved") return '<span class="badge b-approved">approved</span>';
        if (d === "rejected") return '<span class="badge b-rejected">rejected</span>';
        return '<span class="badge b-pending">pending</span>';
      }

      function gaugeBadge(status) {
        const cls = status === "connected" ? "b-connected" : status === "derived" ? "b-derived" : "b-unavailable";
        return '<span class="badge ' + cls + '">' + escapeHtml(status) + "</span>";
      }

      function setActiveThread() {
        document.querySelectorAll("#threads .thread").forEach((node) =>
          node.classList.toggle("active", node.getAttribute("data-id") === activeRecordId),
        );
      }

      async function loadThreads() {
        const { status, json } = await api("GET", "/decisions");
        const el = $("threads");
        if (status !== 200) {
          // Surface transport failures explicitly: an errored catalog must never
          // masquerade as "No decisions yet" when records may exist on disk.
          el.innerHTML =
            '<div class="empty" style="color:#f87171">Could not load decisions (' + status + ").</div>";
          return null;
        }
        const threads = (json && json.threads) || [];
        if (threads.length === 0) {
          el.innerHTML = '<div class="empty">No decisions yet. Propose one above.</div>';
          return threads;
        }
        el.innerHTML = threads
          .map((t) => {
            const openId = t.finalRecordId || t.draftRecordId;
            const active = openId === activeRecordId ? " active" : "";
            return (
              '<div class="thread' + active + '" data-id="' + openId + '">' +
              '<div class="goal">' + escapeHtml(t.goal || "(no goal)") + "</div>" +
              '<div class="meta">' + decisionBadge(t.ratifiedDecision) +
              '<span class="mono">' + (openId || "").slice(0, 12) + "</span></div></div>"
            );
          })
          .join("");
        el.querySelectorAll(".thread").forEach((node) =>
          node.addEventListener("click", () => loadDetail(node.getAttribute("data-id"))),
        );
        return threads;
      }

      function sectionBody(s) {
        if (s.status === "unavailable") return s.reason || "";
        let txt = s.display || "";
        if (s.status === "derived" && Array.isArray(s.derivedFrom) && s.derivedFrom.length) {
          txt += "\n(derived from: " + s.derivedFrom.join(", ") + ")";
        }
        return txt;
      }

      async function loadDetail(recordId) {
        if (!recordId) return;
        activeRecordId = recordId;
        setActiveThread();
        const { status, json } = await api("GET", "/decisions/" + encodeURIComponent(recordId));
        if (status !== 200) {
          $("detail").innerHTML = '<div class="empty">Record not found.</div>';
          return;
        }
        const p = json.projection || {};
        const epi = json.epistemic || [];
        const env = json.envelope || {};
        const isDraft = env.kind === "draft";

        const sections = (p.sections || [])
          .map(
            (s) =>
              '<div class="section"><div class="head"><span class="stage">' +
              escapeHtml(s.stage) + "</span>" + gaugeBadge(s.status) +
              '</div><div class="body">' + escapeHtml(sectionBody(s)) + "</div></div>",
          )
          .join("");

        const epiRows = epi
          .map(
            (e) =>
              '<div class="epi"><div class="kind">' + escapeHtml(e.kind) + "</div>" +
              "<div>" + gaugeBadgeEpi(e.status) + "</div>" +
              '<div class="stmt">' + escapeHtml(e.statement || "—") + "</div></div>",
          )
          .join("");

        const ratifyControls = isDraft
          ? '<div class="row" style="margin-top:6px">' +
            '<button class="approve" data-act="approved">Approve</button>' +
            '<button class="reject" data-act="rejected">Reject</button>' +
            '<span class="muted">Your decision is the only write this Portal makes.</span></div>'
          : '<div class="muted" style="margin-top:6px">This decision is ratified (final record). The record is immutable.</div>';

        $("detail").innerHTML =
          '<div class="card"><div class="row" style="justify-content:space-between">' +
          "<div><h2 style=\"margin:0 0 4px\">" + (isDraft ? "Draft proposal" : "Final record") + "</h2>" +
          '<div class="mono">' + escapeHtml(p.recordId || "") + "</div></div>" +
          decisionBadgeForRecord(p) + "</div>" +
          '<div style="margin-top:10px;font-size:15px">' + escapeHtml((p.humanIntent && p.humanIntent.goal) || "") + "</div>" +
          ratifyControls + "</div>" +
          "<h2>Governed record — every section is connected, derived, or unavailable (never invented)</h2>" +
          sections +
          '<h2 style="margin-top:18px">Epistemic objects — reasoning is not truth; only Outcome closes the loop against reality</h2>' +
          '<div class="card">' + epiRows + "</div>" +
          '<div class="note">Inference = what evidence suggests · Hypothesis = what may explain it · Prediction = what may happen · Outcome = what actually happened. UNKNOWN is earned, never faked.</div>';

        const thread = env.threadId;
        $("detail").querySelectorAll("button[data-act]").forEach((b) =>
          b.addEventListener("click", () => ratify(thread, b.getAttribute("data-act"))),
        );
      }

      function decisionBadgeForRecord(p) {
        const r = (p.sections || []).find((s) => s.stage === "ratification");
        // Anchor to the "decision:" token so an approver value that merely contains
        // "approved"/"rejected" (e.g. "preapproved-admin") cannot flip the badge.
        if (r && r.status === "connected" && /decision:\s*approved\b/.test(r.display || "")) return decisionBadge("approved");
        if (r && r.status === "connected" && /decision:\s*rejected\b/.test(r.display || "")) return decisionBadge("rejected");
        return decisionBadge(null);
      }

      function gaugeBadgeEpi(status) {
        // Epistemic statuses get their own subtle treatment; reuse the derived/unavailable palette.
        const cls = status === "REALITY_OBSERVED" ? "b-connected" : status === "UNKNOWN" ? "b-unavailable" : "b-derived";
        return '<span class="badge ' + cls + '">' + escapeHtml(status) + "</span>";
      }

      async function ratify(threadId, decision) {
        if (!threadId) return;
        const { status, json } = await api("POST", "/decisions/" + encodeURIComponent(threadId) + "/ratify", { decision });
        if (status === 200) {
          toast("Ratified: " + decision);
          activeRecordId = (json.projection && json.projection.recordId) || activeRecordId;
          await loadThreads();
          await loadDetail(activeRecordId);
        } else {
          toast((json && json.error) || "Ratify failed (" + status + ")", true);
          const threads = await loadThreads();
          // Re-sync the detail pane to the thread's canonical record so stale
          // Approve/Reject controls vanish when the thread is already final
          // (e.g. 409 after a concurrent ratify via CLI or another request).
          const t = (threads || []).find((x) => x.threadId === threadId);
          await loadDetail(t ? t.finalRecordId || t.draftRecordId : activeRecordId);
        }
      }

      async function propose() {
        const goal = $("goal").value.trim();
        if (!goal) { toast("Enter a goal first", true); return; }
        const constraints = $("constraints").value.split(",").map((s) => s.trim()).filter(Boolean);
        const { status, json } = await api("POST", "/decisions", { goal, constraints });
        if (status === 201) {
          $("goal").value = "";
          $("constraints").value = "";
          activeRecordId = (json.projection && json.projection.recordId) || null;
          await loadThreads();
          await loadDetail(activeRecordId);
        } else {
          toast((json && json.error) || "Propose failed (" + status + ")", true);
        }
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      $("propose").addEventListener("click", propose);
      loadThreads();
    </script>
  </body>
</html>
